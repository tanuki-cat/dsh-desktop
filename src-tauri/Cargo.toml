[package]
name = "dsh-desktop"
version = "0.5.1"
edition = "2021"
rust-version = "1.77"
description = "Tauri shell that supervises `dsh web` and hosts it in the system WebView"
license = "MIT"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dsh-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# SHA-256 for the desktop app's own update package (see `app_update`). The Tauri updater is not
# used: this repo publishes unsigned .app.zip / .deb / portable .zip artifacts, and the official
# plugin wants a minisign key and a manifest shape the release pipeline does not produce.
sha2 = "0.10"
# Decoding a user-chosen PNG into RGBA for the app icon. `png` rather than `image`: it is already
# in the graph (through Tauri's menu crate and the icon codegen), and it is the only format the
# icon path accepts.
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }
# `NSOpenPanel` picks the custom icon file; `NSImage` + `NSBitmapImageRep` +
# `NSApplication.setApplicationIconImage` are the only way to change the Dock icon of a running
# app. `NSBitmapImageRep` builds the image from the RGBA the PNG decoder produced, so the icon
# path and the file picker share one decoder.
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSBitmapImageRep",
  "NSImage",
  "NSImageRep",
  "NSOpenPanel",
  "NSSavePanel",
  "NSPanel",
  "NSResponder",
  "NSWindow",
] }
