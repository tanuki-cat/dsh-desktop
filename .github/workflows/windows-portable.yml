name: windows-portable

# 在 Windows runner 上**原生** stage 运行时，打出免安装的便携包。
#
# 为什么必须在 Windows 上 stage：在 macOS 上用 `npm install --os=win32` 装 dsh 时，
# koffi 的平台包不会被装上（npm 的 --os/--cpu 对全局安装的依赖树不生效），postinstall 会
# 回退到就地编译并因缺 CMake 失败 —— 实测过。Windows runner 上原生安装才能拿到正确的原生模块。
#
# 两种触发方式共用同一份实现：
#   * workflow_dispatch —— 手动出包，产物作为 workflow artifact（可选附加到已有 Release）；
#   * workflow_call    —— 由 release.yml 在打 tag 时调用，产物交给它的 release 任务统一发布。
#
# 分支策略：自带运行时已并入 main（2026-09-13 合并 feat/bundled-runtime），因此默认就从 main 构建；
# build_ref 仍可指向任意分支或 tag（临时验证某个分支的 staging 时用）。
on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 随包附带的 dsh 版本
        required: false
        type: string
        default: 0.1.5-rc.2
      node_version:
        description: 随包附带的 Node 版本
        required: false
        type: string
        default: 22.23.2
      build_ref:
        description: 从哪个分支或 tag 构建
        required: false
        type: string
        default: main
      attach_to_release:
        description: 可选：把产物传到已存在的 Release tag（留空则只作为 workflow artifact）
        required: false
        type: string
        default: ""
  # 被 release.yml 在打 tag 时调用；输入与手动触发完全一致（不用 YAML 锚点，避免解析差异）。
  workflow_call:
    inputs:
      dsh_version:
        description: 随包附带的 dsh 版本
        required: false
        type: string
        default: 0.1.5-rc.2
      node_version:
        description: 随包附带的 Node 版本
        required: false
        type: string
        default: 22.23.2
      build_ref:
        description: 从哪个分支或 tag 构建（release.yml 传 tag 名）
        required: false
        type: string
        default: main
      attach_to_release:
        description: 可选：把产物传到已存在的 Release tag（release.yml 留空，交给它的 release 任务发布）
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  portable:
    name: build windows-x64 portable
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}

      - uses: pnpm/action-setup@v4      # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-portable

      - name: 工具链自检
        run: |
          set -euo pipefail
          rustc --version
          node --version
          pnpm --version
          python --version
          make --version 2>/dev/null | head -1 || echo "(Windows 上不依赖 make)"

      - name: 读取版本号
        id: version
        run: |
          set -euo pipefail
          version=$(python -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "打包版本 $version"

      - name: 离线测试门禁
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: 原生 stage Windows 运行时（Node + dsh + pnpm + 插件市场模板）
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
          NODE_VERSION: ${{ inputs.node_version }}
          PYTHON: python
        run: |
          set -euo pipefail
          sh scripts/stage-runtime.sh src-tauri/runtime

      - name: 构建可执行文件（不出安装器）
        run: |
          set -euo pipefail
          pnpm tauri build --no-bundle

      - name: 组装免安装目录
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app="dist/DSH Desktop"
          rm -rf dist
          mkdir -p "$app"
          cp src-tauri/target/release/dsh-desktop.exe "$app/"

          # exe 的导入表里有 WebView2Loader.dll，必须与它同目录
          dll=$(find "$HOME/.cargo/registry/src" -path "*webview2-com-sys-*/x64/WebView2Loader.dll" 2>/dev/null | head -1)
          [ -n "$dll" ] || { echo "::error::找不到 WebView2Loader.dll"; exit 1; }
          cp "$dll" "$app/"

          # 运行时放在 exe 旁边：应用按「同目录 runtime/」发现它（种子解析的第一顺位之一）
          #
          # 用 tar 管道而不是 cp -R：Git Bash 的 cp 在 pnpm 包内的符号链接（pn/pnpx/pnx）上会报
          # "cannot create regular file … File exists"，而 Windows 上创建 symlink 还需要额外权限。
          # -h 解引用符号链接（本机 bsdtar 实测：普通文件、可执行位保留、31087 个文件）。
          mkdir -p "$app/runtime"
          tar -chf - -C src-tauri/runtime . | tar -xf - -C "$app/runtime"
          test -f "$app/runtime/node/node.exe" || { echo "::error::运行时拷贝不完整"; exit 1; }

          # 文件名用 ASCII：中文文件名在不同解压工具里容易乱码（内容仍是中文）
          cat > "$app/README.txt" <<TXT
          DSH Desktop（Windows 免安装版）

          1) 解压后双击 "DSH Desktop\dsh-desktop.exe" 即可，不要单独移动 exe。
          2) 本包已自带 Node、dsh 与插件市场，目标机器无需安装任何东西。
          3) 未签名：SmartScreen 提示时选“仍要运行”。
          4) 需要 WebView2 运行时：Windows 11 自带；Windows 10 可装
             https://developer.microsoft.com/microsoft-edge/webview2/

          【解压注意】包里是完整的 Node 依赖树，最深约 223 个字符。Windows 资源管理器
          的“全部解压”会再套一层 <下载目录>\<压缩包名>\，很容易超过 260 字符的 MAX_PATH
          限制并报错 0x80010135（路径太长）。任选一种方式：

            A. 解压到短路径，例如 D:\dsh
            B. 用 Windows 10+ 自带的 tar（不依赖任何第三方工具）：
                 tar -xf dsh-desktop_<版本>_windows-x64-portable.zip -C D:\dsh
            C. 用 7-Zip 右键“解压到 …”（7-Zip 支持长路径）
            D. 直接用同目录的 .exe 自解压包（若有），双击后选择 D:\dsh 这类短目录

          排障：日志在 %APPDATA%\com.deepseek.dsh.desktop\logs\harness.log，
          里面会写明用的是自带运行时还是系统安装（runtime: node … (bundled) …）。
          TXT

          # 在 dist 里打包：否则 7z 会把 "dist/DSH Desktop/…" 整条相对路径写进压缩包，
          # 解压后多一层 dist 目录。
          (cd dist && 7z a -tzip "dsh-desktop_${VERSION}_windows-x64-portable.zip" "DSH Desktop" >/dev/null)

          # 自解压包：Windows 资源管理器的解压不支持长路径，7-Zip 的 SFX 支持，双击即可用。
          # 7z.sfx 在 runner 的 7-Zip 安装目录里；没有就跳过（zip 仍在）。
          sfx="/c/Program Files/7-Zip/7z.sfx"
          if [ -f "$sfx" ]; then
            (cd dist && 7z a -t7z -mx=1 "inner.7z" "DSH Desktop" >/dev/null \
              && cat "$sfx" inner.7z > "dsh-desktop_${VERSION}_windows-x64-portable.exe" \
              && rm -f inner.7z)
            echo "已生成自解压 exe（双击解压，支持长路径）"
          else
            echo "提示：未找到 7z.sfx，跳过自解压包"
          fi

          # 最长路径由 scripts/check-runtime-stage.sh 在 staging 阶段报告（Windows MAX_PATH 260，
          # 解压目录还会再占一截）；这里只提醒用户怎么解压。
          echo "提醒：解压到 D:\dsh 这类短路径，或使用自解压 exe / tar / 7-Zip"
          ls -lh dist

      # 校验和文件名与 macOS/Linux 一致（SHA256SUMS-<suffix>），release 任务会把它们合并成 SHA256SUMS。
      # 用 python 而不是 sha256sum：Git for Windows 不保证带 coreutils。
      - name: 生成校验和
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, hashlib, os

          def digest(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          files = sorted(glob.glob("dist/*.zip")) + sorted(glob.glob("dist/*.exe"))
          with open("dist/SHA256SUMS-windows-x64", "w", newline="\n") as out:
              for path in files:
                  out.write(f"{digest(path)}  {os.path.basename(path)}\n")
          print(open("dist/SHA256SUMS-windows-x64").read())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64-portable
          path: |
            dist/*.zip
            dist/*-portable.exe
            dist/SHA256SUMS-windows-x64
          if-no-files-found: error
          retention-days: 30

      - name: 可选：附加到已有 Release
        if: inputs.attach_to_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.attach_to_release }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.zip dist/SHA256SUMS-windows-x64 --clobber
