name: release

# 由 release tag（v*，例如 v0.1.0）触发：构建 macOS / Linux 产物并附到同名 GitHub Release。
# 手动触发（workflow_dispatch）只构建并上传 workflow artifact，不创建 Release。
#
# 每个平台出两种产物：精简版（只有壳，目标机器需自备 node/dsh）与自带运行时版（文件名带
# `-bundled`，随包带 Node + dsh + 插件市场，双击即用）。自带运行时版由 make bundle-bundled 产出，
# 运行时按 **TARGET** 的平台 staging —— 在 arm64 runner 上交叉编译 x64 时不会误装 arm64 的 node。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与各清单版本一致
        id: check
        run: |
          set -euo pipefail
          version=$(jq -r .version src-tauri/tauri.conf.json)
          cargo_version=$(grep -m1 "^version" src-tauri/Cargo.toml | tr -d " " | cut -d= -f2 | tr -d "\"")
          node_version=$(jq -r .version package.json)
          echo "tauri.conf.json=$version  Cargo.toml=$cargo_version  package.json=$node_version"
          [ "$version" = "$cargo_version" ] || { echo "::error::Cargo.toml 与 tauri.conf.json 版本不一致"; exit 1; }
          [ "$version" = "$node_version" ] || { echo "::error::package.json 与 tauri.conf.json 版本不一致"; exit 1; }

          # 随包运行时的版本来自三个地方：Makefile（macOS/Linux 的 runtime-stage）、
          # scripts/stage-runtime.sh（Windows 的 staging）、以及 windows-portable.yml 里两份
          # workflow 默认值（workflow_dispatch 与 workflow_call 各一份）。它们此前没有任何
          # 门禁 —— 改了 Makefile 却漏改 workflow 默认值时，同一个 tag 下 Windows 便携包与
          # macOS/Linux 包会带不同版本的 dsh / Node / 插件市场，而 Release 正文仍宣称单一
          # 版本（review B6）。插件市场在 2026-10-17 一并纳入：它与 dsh 核心一样是随包播种的
          # 一份依赖，漏改时新机器首启装到的市场版本与其余平台不同。
          #
          # The awk below walks each input block: the key line sets the indentation, and the
          # first `default:` at a deeper one is its value. Plain `grep -A2` was tried first and
          # silently matched nothing, which would have made this check vacuous.
          workflow_value() {
            awk -v key="$1:" '
              {
                match($0, /^ */); indent = RLENGTH
                if ($1 == key) { keyindent = indent; inside = 1; next }
                if (inside) {
                  if (indent <= keyindent && $0 !~ /^ *$/) { inside = 0; next }
                  if ($1 == "default:") { print $2 }
                }
              }' .github/workflows/windows-portable.yml | sort -u
          }
          for name in NODE_VERSION DSH_VERSION DSHMARKET_VERSION; do
            make_value=$(grep -m1 "^$name " Makefile | awk '{ print $3 }')
            lower=$(printf %s "$name" | tr "A-Z" "a-z")
            script_value=$(grep -m1 "^${lower}=" scripts/stage-runtime.sh | sed -e "s/^[^:]*:-//" -e "s/}.*$//")
            portable_values=$(workflow_value "$lower")
            echo "$name: Makefile=$make_value  stage-runtime.sh=$script_value  windows-portable.yml=$(printf %s "$portable_values" | tr "\n" " ")"
            [ -n "$make_value" ] || { echo "::error::Makefile 里找不到 $name"; exit 1; }
            [ -n "$portable_values" ] || { echo "::error::windows-portable.yml 里找不到 $lower 的默认值"; exit 1; }
            [ "$make_value" = "$script_value" ] || { echo "::error::$name 在 Makefile 与 stage-runtime.sh 之间不一致（$make_value vs $script_value）"; exit 1; }
            for portable in $portable_values; do
              [ "$portable" = "$make_value" ] || { echo "::error::$name 在 Makefile 与 windows-portable.yml 之间不一致（$make_value vs $portable）"; exit 1; }
            done
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与清单版本 v${version} 不一致，请先改版本号再打 tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.suffix }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false        # 一个平台失败不影响其它平台的产物
      matrix:
        include:
          # macos-15（arm64）而不是 macos-latest：发布流水线钉版本，避免 GitHub 换默认镜像
          # 时构建环境悄悄变化。macos-14 已于 2026-11-02 退役，用它打 tag 时任务会在分配
          # runner 阶段被取消（"The configuration 'macos-14-arm64-us-default' is not supported"）。
          # 可用标签见 https://github.com/actions/runner-images#available-images —— 再退役时
          # 这一行要跟着换（macOS 26 的 arm64 标签是 macos-26 / macos-latest）。
          - os: macos-15          # Apple Silicon
            suffix: macos-arm64
            bundles: app
            target: ""
            timeout: 90
          # Intel 包在 arm64 runner 上交叉编译：macos-13（最后一个 x64 镜像）排队时间不可控，
          # 实测曾把整个 run 卡在 queued，导致 release job 永不执行。
          - os: macos-15
            suffix: macos-x64
            bundles: app
            target: x86_64-apple-darwin
            timeout: 90
          - os: ubuntu-22.04
            suffix: linux-x64
            bundles: deb
            timeout: 75
          # arm64 runner 对公开仓库可用；若你的计划里没有，删掉下面这一项即可
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
            bundles: deb
            timeout: 75
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖（WebKitGTK 等）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file patchelf \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4      # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5   # make runtime-stage 用 python3 生成 THIRD-PARTY-NOTICES.md
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.suffix }}

      # staging 的输入比产物小得多、复用收益却很大：dsh 依赖树来自几百个 registry 包，
      # 冷装是几百次带延迟的请求，热缓存则是一次 ~250 MB 的恢复（npm 缓存 204 MB + Node 包 48 MB）。
      # key 里带 matrix.suffix：macos-arm64 与 macos-x64 都在 arm64 runner 上跑，需要各自隔离。
      # 缓存不影响信任链 —— runtime-fetch 仍然按 src-tauri/runtime.lock 校验 SHA256，
      # 缓存命中只是省掉下载。
      #
      # 刻意不缓存 src-tauri/runtime/ 本身：520 MB × 5 个平台会把仓库 10 GB 的缓存配额挤爆，
      # 而 staging 每次都会被整体清空重建（见 Makefile 的 runtime-stage 与那份闸门脚本）。
      - name: 缓存 staging 输入（Node 包 + npm/pnpm 缓存）
        uses: actions/cache@v4
        with:
          path: |
            .runtime-cache/node-v*
            .runtime-cache/SHASUMS256*.txt
            .runtime-cache/npm
            .runtime-cache/pnpm-store
          key: runtime-${{ runner.os }}-${{ matrix.suffix }}-${{ hashFiles('src-tauri/runtime.lock', 'Makefile', 'scripts/stage-runtime.sh', 'scripts/make-profile-template.sh', 'scripts/check-runtime-stage.sh') }}
          restore-keys: |
            runtime-${{ runner.os }}-${{ matrix.suffix }}-

      - name: 工具链自检
        run: make doctor

      - name: 格式、lint 与测试（发布门禁）
        run: |
          set -euo pipefail
          make fmt-check          # 只检查：make fmt 会改工作区，失败时看不出原始差异
          make clippy
          make test

      - name: 交叉编译所需的 Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: 打包（精简版 + 自带运行时版）
        env:
          BUNDLE_TARGETS: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          out="src-tauri/target/${TARGET:+$TARGET/}release/bundle"
          make bundle BUNDLE_TARGETS="$BUNDLE_TARGETS" TARGET="$TARGET"

          # 第二遍构建会用同名产物覆盖第一遍：先把精简版挪进 thin/。macOS 是 .app，Linux 是 .deb。
          mkdir -p thin
          if [ "$RUNNER_OS" = "macOS" ]; then
            mv "$out/macos/DSH Desktop.app" thin/
          else
            shopt -s nullglob
            debs=("$out/deb"/*.deb)
            [ ${#debs[@]} -gt 0 ] || { echo "::error::精简版没有产出 .deb"; exit 1; }
            mv "${debs[@]}" thin/
          fi
          ls -l thin

          # 自带运行时版：runtime-stage 组装**本平台**的运行时（TARGET 决定 stage 哪个架构），
          # 再以 --config 注入 bundle.resources —— 基座 tauri.conf.json 里没有这条 glob，
          # 否则普通 make bundle 会把整份 staging 静默打进包（桌面壳审查 §10 记过的坑）。
          make bundle-bundled BUNDLE_TARGETS="$BUNDLE_TARGETS" TARGET="$TARGET"

      - name: 整理 macOS 产物
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app="src-tauri/target/${TARGET:+$TARGET/}release/bundle/macos/DSH Desktop.app"
          [ -d "$app" ] || { echo "::error::找不到自带运行时版的 $app"; exit 1; }
          # bundle.resources 没生效时会安静地产出一个只有壳的包，这里直接拦住
          [ -f "$app/Contents/Resources/runtime/node/bin/node" ] \
            || { echo "::error::自带运行时版的 .app 里没有 runtime/node（bundle.resources 没生效？）"; exit 1; }
          du -sh "$app" thin/"DSH Desktop.app"
          mkdir -p dist
          # 精简版：只有壳，目标机器需自备 node/dsh
          ditto -c -k --sequesterRsrc --keepParent "thin/DSH Desktop.app" "dist/dsh-desktop_${VERSION}_${SUFFIX}.app.zip"
          # 自带运行时版：约 600 MB，解压拖进「应用程序」即可，无需预装
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/dsh-desktop_${VERSION}_${SUFFIX}-bundled.app.zip"
          (cd dist && shasum -a 256 ./*.zip | sed "s|\./||" > "SHA256SUMS-${SUFFIX}")

      - name: 整理 Linux 产物
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          # 精简版：只有壳，目标机器需自备 node/dsh
          for deb in thin/*.deb; do
            cp "$deb" "dist/dsh-desktop_${VERSION}_${SUFFIX}.deb"
          done
          # 自带运行时版：约 600 MB（deb 里是整棵 Node 依赖树）
          bundled=(src-tauri/target/${TARGET:+$TARGET/}release/bundle/deb/*.deb)
          [ ${#bundled[@]} -gt 0 ] || { echo "::error::没有产出自带运行时版的 .deb"; exit 1; }
          for deb in "${bundled[@]}"; do
            cp "$deb" "dist/dsh-desktop_${VERSION}_${SUFFIX}-bundled.deb"
          done
          # resources 没打进去时会安静地产出一个和精简版差不多大的包，这里按体积比拦住
          thin_size=$(stat -c%s "dist/dsh-desktop_${VERSION}_${SUFFIX}.deb")
          bundled_size=$(stat -c%s "dist/dsh-desktop_${VERSION}_${SUFFIX}-bundled.deb")
          [ "$bundled_size" -gt $((thin_size * 3)) ] \
            || { echo "::error::自带运行时版只比精简版大一点（$bundled_size vs $thin_size 字节），resources 可能没生效"; exit 1; }
          (cd dist && sha256sum ./*.deb | sed "s|\./||" > "SHA256SUMS-${SUFFIX}")

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Windows 免安装包复用 windows-portable.yml 的实现：staging 与打包只有一份脚本，
  # 手动出包和打 tag 发布不会各修一遍。产物交给下面的 release 任务统一发布，
  # 所以这里不传 attach_to_release。
  #
  # 自带运行时已并入 main（2026-09-13 合并 feat/bundled-runtime），所以在 main 上打 tag 就会
  windows-portable:
    name: build windows-x64
    needs: preflight
    uses: ./.github/workflows/windows-portable.yml
    with:
      build_ref: ${{ github.ref_name }}

  release:
    name: publish release
    needs: [preflight, build, windows-portable]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      # gh release 需要 git 仓库上下文（否则报 fatal: not a git repository）
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 汇总校验和
        run: |
          set -euo pipefail
          cd dist
          ls -l
          cat SHA256SUMS-* > SHA256SUMS
          rm -f SHA256SUMS-*

      - name: 创建/更新 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # 引号版 heredoc：正文里的 Markdown 反引号不会被 bash 当成命令替换执行，
          # 版本号用占位符替换（避免在这里做 shell 展开）。
          cat > notes.md <<'MD'
          ## DSH Desktop v__VERSION__

          ### 本版更新

          - **桌面应用自更新**（[issue #2](https://github.com/tanuki-cat/dsh-desktop/issues/2)）：壳自己也有版本了。启动后在 Harness 窗口出现之后用后台线程查 GitHub Releases，按平台/架构/是否自带运行时**精确**选资产（不做跨架构的降级猜测），下载后与 Release 的 `SHA256SUMS` 逐字比对，只有校验通过的包才进 `app-update/ready/`。`app_update` 默认 `notify`——标题与日志里提示，菜单「视图 → 检查桌面应用更新…」当场查；`download` 自动准备；`install` 在 macOS 上继续装好并重启（`ditto` 解包 → 校验 bundle id/版本 → 备份旧 `.app` → 换入 → 清 quarantine → 重启），Linux/Windows 停在「已校验的包在这里」，由菜单「安装已下载的更新…」给出手动命令。刻意不引入 `tauri-plugin-updater`：它要 minisign 私钥与 `.app.tar.gz`，与本仓库未签名、出 `.app.zip`/`.deb`/便携 zip 的发布形状对不上。
          - **可切换的应用图标**（同上）：菜单「外观」里有默认 + 深海 / 极夜 / 晨雾 四套（全部 `include_bytes!` 内嵌，精简版与自带运行时版表现一致），以及「选择自定义图片…」。自定义 PNG 先解码整理——调色板/灰度/16 位由解码器展开，非正方形按中心裁切，超过 1024 px 用面积平均缩放，短边小于 64 px 才拒绝——整理后的图存进 `<app-data>/icons/custom.png`，选完不依赖原文件。macOS 走 `NSApplication.setApplicationIconImage`（Dock 与 ⌘Tab），Windows/Linux 走窗口图标；选择写 `appearance.json`，每次启动重新应用，不改包里的 `.icns`/`.ico`（那会破坏签名）。
          - **修掉的既有问题**：更新后重启与单实例插件的竞态（新实例在旧进程退出前连上 socket 会自己退出，导致两个都没了——改为 `open -n` 之后立刻释放 socket）；`download` 策略在 macOS 上装不上（新增「安装已下载的更新…」入口、复用已校验的包、拒绝把旧包装成降级）；下载失败只剩一个退出码（curl 的错误现在并进 stdout，缺工具不再被误报成超时）；自定义图片被拒时界面毫无反应（现在弹原因）；备份按**被替换**的版本命名且只留最新一份；Dock 位图改用预乘 alpha（半透明边缘不再发白）。
          - **随包运行时未变**：仍是 dsh `0.2.1-rc.4` / Node `22.23.2` / dshmarket `1.73.1`；装好之后的 dsh 核心与插件市场照旧跟随 npm registry 自动更新。

          ### 验证与范围

          离线门禁全绿：`make fmt-check` / `make clippy --all-targets -D warnings` / `make test`（**304 passed**，比上一版多 49 条），`tests/webkit_compat_shim.rs` 另有 5 条在真实 node 引擎里跑兼容层与状态页脚本。

          新增覆盖：资产命名与真实 Release 逐字比对、渠道选择、无资产不降级、`SHA256SUMS` 解析、校验失败即删、已校验包复用、备份命名、安装前拒绝降级、重启与单实例 socket 的顺序、PNG 灰度/16 位展开、中心裁切、超限缩放、预乘 alpha、标题三态。

          联网（`DSH_DESKTOP_LIVE_TESTS=1`）：3 条走真实 GitHub Release——列表可取、`SHA256SUMS` 可解析且含本机构建对应的条目、完整下载 7.86 MB 的 `linux-x64.deb` 并校验后落到 `ready/`；另用同一套 `curl` 参数复核过 `dsh-desktop_0.4.15_linux-x64.deb` 的 SHA256 与清单逐字相同。

          实机（macOS arm64，上一版构建）：菜单构建、预设图标切换（Dock 图标随之变化）、后台更新检查跑通、Harness 正常启停与回收。自定义图片的问题正是从这台机器的日志里定位的——三张图分别被「不是正方形」和「超过 1024 像素」拒绝，而 macOS 上只写了日志、界面上没有提示；本版按此改了规则与反馈。

          **待实机点击确认**：本版修复后的自定义图片选择；`app_update: install` 的完整链路（下载 → 装 → 重启后版本号变化）需要打包后的 `.app` 才能点；Dock 之外的 ⌘Tab / 强制退出窗口里的图标同步。

          已知 Linux 上游 Wry 0.55.1 下载失败状态可能跨请求残留：失败或取消后，后续成功下载可能被误报为失败。本版未修复该上游问题。

          历史安全审查记录见 [处理记录](https://github.com/tanuki-cat/dsh-desktop/blob/v__VERSION__/docs/dsh-desktop-f8c9095-security-review.md)。

          ### 产物

          macOS / Linux 每个平台都有两种产物，Windows 只有一种（它本身就是免安装的）：

          - **自带运行时版**（文件名带 `-bundled`）：随包附带 Node 22 与 dsh 核心，**目标机器无需
            安装任何东西**，解压 / 安装后双击即用；分发包较大（随包的 Node 与完整 dsh 插件树合计约 1.1 GB，压缩后仍有数百 MB）。
          - **精简版**（文件名不带后缀）：只有桌面壳，**目标机器需自备 node 与 dsh**，体积小。

          | 平台 | 自带运行时版（推荐） | 精简版（需自备 node/dsh） |
          |---|---|---|
          | macOS arm64 | dsh-desktop___VERSION___macos-arm64-bundled.app.zip | dsh-desktop___VERSION___macos-arm64.app.zip |
          | macOS x64 | dsh-desktop___VERSION___macos-x64-bundled.app.zip | dsh-desktop___VERSION___macos-x64.app.zip |
          | Linux x64 | dsh-desktop___VERSION___linux-x64-bundled.deb | dsh-desktop___VERSION___linux-x64.deb |
          | Linux arm64 | dsh-desktop___VERSION___linux-arm64-bundled.deb | dsh-desktop___VERSION___linux-arm64.deb |
          | Windows x64 | dsh-desktop___VERSION___windows-x64-portable.zip（免安装，自带运行时） | —— |

          自带运行时版首次启动会用包内的 Node + dsh 拉起 Web GUI，不需要联网下载；dsh 核心与插件市场
          dshmarket 之后跟随 npm registry 自动更新（插件市场的自动更新**默认关闭** —— 它会改写 profile 下的
          `package.json` 与锁文件，用 config.json 的 `auto_update_plugins` 开启；核心的 `auto_update` 不受影响）。

          > 🖥 **macOS 的界面需要 Safari 16.4（macOS 13.3）或更新的 WebKit**：随包的 document-preview
          > 插件在更旧的引擎上会在加载期抛 `Can't find variable: Iterator` 一类错误。壳会先探测缺什么，
          > **能补的（Iterator、Promise.try、Math.sumPrecise 等）自己注入兼容层**，补不了的语法
          > （macOS ≤ 12 缺 `class static block`）才改用系统浏览器并写明原因。

          > ⚠️ 这些构建**未签名也未公证**：macOS 首次打开请右键 →「打开」，或执行
          > xattr -dr com.apple.quarantine "/Applications/DSH Desktop.app"。Linux 上 WebKitGTK 仍来自系统。

          校验：shasum -a 256 -c SHA256SUMS（Linux 用 sha256sum -c SHA256SUMS）。

          安装：macOS 解压后把 DSH Desktop.app 拖进「应用程序」；
          Linux sudo apt install ./dsh-desktop___VERSION___linux-x64-bundled.deb；
          Windows 解压到短路径（如 D:\dsh）后双击 DSH Desktop\dsh-desktop.exe —— 包内依赖树最深
          约 223 字符，路径太长时资源管理器会报 0x80010135，可改用同名的 .exe 自解压包或 tar -xf。
          MD
          sed -i.bak "s|__VERSION__|${VERSION}|g" notes.md && rm -f notes.md.bak   # GNU/BSD sed 都可用
          head -5 notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run rebuilds notes.md (new artifact names, new text); uploading over an
            # existing release used to leave the *old* body in place, so the published notes and
            # the published files could disagree (review D3).
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json url --jq .url
