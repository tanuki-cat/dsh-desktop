<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        font: 13px/1.6 -apple-system, "Helvetica Neue", sans-serif;
        background: Canvas; color: CanvasText; padding: 24px; box-sizing: border-box;
      }
      h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
      #status { opacity: .9; }
      #detail {
        width: 100%; max-height: 110px; overflow: auto; white-space: pre-wrap;
        opacity: .7; font-size: 12px; text-align: left;
        background: color-mix(in srgb, CanvasText 6%, transparent);
        border-radius: 6px; padding: 8px; box-sizing: border-box;
      }
      .spinner {
        width: 18px; height: 18px; border-radius: 50%;
        border: 2px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-top-color: CanvasText; animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error .spinner { display: none; }
      #retry {
        font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
        color: CanvasText; background: color-mix(in srgb, CanvasText 8%, transparent);
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      }
      #retry:disabled { opacity: .6; cursor: default; }
      #retry[hidden] { display: none; }
    </style>
    <!--
      Syntax the dsh front end needs that no polyfill can add. The probe cannot compile this
      itself: this page carries a CSP, and `new Function` is what `script-src` forbids — a
      blocked eval throws exactly like an unparseable program, so every machine would look too
      old. A script element is the honest test instead: an engine that cannot parse this block
      discards it and runs the rest of the page, which is how the flag stays unset.

      REQUIRED_SYNTAX in src-tauri/src/window.rs names the same feature; a test binds the two.
    -->
    <script>
      window.__dshSyntaxMissing = [];
    </script>
    <!-- The flag has to live in the SAME script element as the syntax: an engine that cannot
         parse the class body discards this whole element, and a separate one would run anyway. -->
    <script>
      class Probe { static { 1; } }
      window.__dshSyntaxChecked = true;
    </script>
    <script>
      // Rust pushes status through WebviewWindow::eval, which can land before the body
      // exists. Buffer the value here so the first messages are not dropped.
      if (!window.__dshSyntaxChecked) window.__dshSyntaxMissing.push("class static block");
      //
      // The third element marks the terminal page: that is the one offering to start the
      // Harness again, and the only one that should show the button.
      window.__pendingStatus = null;
      window.__setStatus = function (status, detail) {
        window.__pendingStatus = [status, detail, false];
        if (window.__applyStatus) window.__applyStatus();
      };
      window.__setFailure = function (status, detail) {
        window.__pendingStatus = [status, detail, true];
        if (window.__applyStatus) window.__applyStatus();
      };
    </script>
  </head>
  <body>
    <div class="spinner" id="spinner"></div>
    <h1>DeepSeek Harness</h1>
    <div id="status">正在启动…</div>
    <div id="detail"></div>
    <button id="retry" hidden>重新启动 Harness</button>
    <script>
      // Render whatever Rust has already sent (and every later update).
      window.__applyStatus = function () {
        var pending = window.__pendingStatus;
        if (!pending) return;
        document.getElementById("status").textContent = pending[0];
        var box = document.getElementById("detail");
        box.textContent = pending[1] || "";
        document.body.classList.toggle("error", Boolean(pending[1]));
        var retry = document.getElementById("retry");
        retry.hidden = !pending[2];
        if (!retry.hidden) {
          // A previous click may have left it disabled and mid-word.
          retry.disabled = false;
          retry.textContent = "重新启动 Harness";
        }
      };

      // Ask Rust for another attempt. The splash window is the only one holding core
      // permissions (capabilities/splash.json), so the event bridge is the whole API it needs.
      document.getElementById("retry").addEventListener("click", function () {
        var button = this;
        var restore = function () {
          button.disabled = false;
          button.textContent = "重新启动 Harness";
        };
        button.disabled = true;
        button.textContent = "正在重启…";
        try {
          window.__TAURI_INTERNALS__
            .invoke("plugin:event|emit", { event: "dsh-desktop:restart-harness", payload: {} })
            .catch(restore);
        } catch (error) {
          restore();
        }
      });

      window.__applyStatus();
    </script>
  </body>
</html>
