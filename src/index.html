<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; overflow: auto;
        font: 13px/1.6 -apple-system, "Helvetica Neue", sans-serif;
        background: Canvas; color: CanvasText; padding: 24px; box-sizing: border-box;
      }
      /*
        Centred by `margin: auto` on the content, NOT by `justify-content: center` on the body.
        A flex container that centres its items clips the overflow at both ends when they are
        taller than it is: the takeover question pushed the spinner and title off the top and
        cut the explanation mid-line at the bottom (seen on a real launch, 2026-09-16).
        `margin: auto` centres while there is room and collapses to zero when there is not, so
        the page scrolls instead of losing the text the user is being asked to read.
      */
      #page {
        margin: auto; display: flex; flex-direction: column; align-items: center; gap: 12px;
        width: 100%; max-width: 420px;
      }
      h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
      #status { opacity: .9; }
      #detail {
        width: 100%; max-height: 110px; overflow: auto; white-space: pre-wrap;
        opacity: .7; font-size: 12px; text-align: left;
        background: color-mix(in srgb, CanvasText 8%, transparent);
        border-radius: 6px; padding: 8px; box-sizing: border-box;
      }
      /*
        The question puts the whole explanation in here, and it is what the choice is about, so
        the box gets more room and a higher contrast. The cap matters as much as the room: the
        command line can be arbitrarily long, and letting the box grow with it pushed the last
        button below the fold — the one thing on this page that must not happen (seen with a
        Toolbox-length node path, 2026-09-16). Past the cap the box scrolls instead.
      */
      body.asking #detail { max-height: 240px; opacity: .85; }
      body.asking .spinner { display: none; }
      /* An empty detail is the normal state while starting: an empty grey bar reads as a
         rendering glitch. `:empty` matches only truly empty, so a detail of "" from Rust is
         hidden too, which is what a caller passing no detail means. */
      #detail:empty { display: none; }
      /* The buttons and the hint are the answer; they never shrink to make room for text. */
      #choice, #retry { flex: 0 0 auto; }
      .spinner {
        width: 18px; height: 18px; border-radius: 50%;
        border: 2px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-top-color: CanvasText; animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error .spinner { display: none; }
      #retry {
        font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
        color: CanvasText; background: color-mix(in srgb, CanvasText 8%, transparent);
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      }
      #retry:disabled { opacity: .6; cursor: default; }
      #retry[hidden] { display: none; }
      #choice { display: flex; flex-direction: column; gap: 8px; width: 100%; }
      #choice[hidden] { display: none; }
      #choice button {
        font: inherit; padding: 7px 12px; border-radius: 6px; cursor: pointer; text-align: left;
        color: CanvasText; background: color-mix(in srgb, CanvasText 8%, transparent);
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      }
      #choice button:disabled { opacity: .6; cursor: default; }
      #choice .hint { opacity: .65; font-size: 12px; }
    </style>
    <!--
      Syntax the dsh front end needs that no polyfill can add. The probe cannot compile this
      itself: this page carries a CSP, and `new Function` is what `script-src` forbids — a
      blocked eval throws exactly like an unparseable program, so every machine would look too
      old. A script element is the honest test instead: an engine that cannot parse this block
      discards it and runs the rest of the page, which is how the flag stays unset.

      REQUIRED_SYNTAX in src-tauri/src/window/tests.rs names the same feature; that test binds
      the two.
    -->
    <script>
      window.__dshSyntaxMissing = [];
    </script>
    <!-- The flag has to live in the SAME script element as the syntax: an engine that cannot
         parse the class body discards this whole element, and a separate one would run anyway. -->
    <script>
      class Probe { static { 1; } }
      window.__dshSyntaxChecked = true;
    </script>
    <script>
      // Rust pushes status through WebviewWindow::eval, which can land before the body
      // exists. Buffer the value here so the first messages are not dropped.
      if (!window.__dshSyntaxChecked) window.__dshSyntaxMissing.push("class static block");
      //
      // The third element marks the terminal page: that is the one offering to start the
      // Harness again, and the only one that should show the button.
      window.__pendingStatus = null;
      window.__setStatus = function (status, detail) {
        window.__pendingStatus = [status, detail, false];
        if (window.__applyStatus) window.__applyStatus();
      };
      window.__setFailure = function (status, detail) {
        window.__pendingStatus = [status, detail, true];
        if (window.__applyStatus) window.__applyStatus();
      };
      //
      // The takeover question. Same buffering rule as the status: Rust may ask before the body
      // exists. An empty list clears the question.
      window.__pendingChoice = null;
      window.__askChoice = function (question, status, detail, options, hint) {
        window.__pendingChoice = [question, status, detail, options || [], hint || ""];
        if (window.__applyChoice) window.__applyChoice();
      };
    </script>
  </head>
  <body>
    <!-- One column, centred by `margin: auto`; see the layout note in the stylesheet. -->
    <div id="page">
      <div class="spinner" id="spinner"></div>
      <h1>DeepSeek Harness</h1>
      <div id="status">正在启动…</div>
      <div id="detail"></div>
      <button id="retry" hidden>重新启动 Harness</button>
      <!--
        The takeover question. Rust writes the labels (they carry the pid, the command line and
        the port), the page only draws them and reports which one was clicked: the buttons are
        created here rather than injected as HTML, so nothing from a process command line can
        become markup.
      -->
      <div id="choice" hidden></div>
    </div>
    <script>
      // Render whatever Rust has already sent (and every later update).
      window.__applyStatus = function () {
        var pending = window.__pendingStatus;
        if (!pending) return;
        document.getElementById("status").textContent = pending[0];
        var box = document.getElementById("detail");
        box.textContent = pending[1] || "";
        document.body.classList.toggle("error", Boolean(pending[1]));
        var retry = document.getElementById("retry");
        retry.hidden = !pending[2];
        if (!retry.hidden) {
          // A previous click may have left it disabled and mid-word.
          retry.disabled = false;
          retry.textContent = "重新启动 Harness";
        }
      };

      // Draw the takeover question, and report the click back to Rust.
      window.__applyChoice = function () {
        var pending = window.__pendingChoice;
        var box = document.getElementById("choice");
        if (!pending) return;
        var question = pending[0];
        var options = pending[3] || [];
        document.getElementById("status").textContent = pending[1];
        document.getElementById("detail").textContent = pending[2] || "";
        document.body.classList.toggle("error", false);
        // While the question is up the detail box is the question, not a log tail: give it the
        // room to be read in full and drop the spinner, which says "working" while the shell is
        // in fact waiting for a person.
        document.body.classList.toggle("asking", options.length > 0);
        // The question replaces the restart button: two live buttons on one page would let a
        // click race the answer the shell is already waiting for.
        document.getElementById("retry").hidden = true;
        while (box.firstChild) box.removeChild(box.firstChild);
        if (!options.length) {
          box.hidden = true;
          return;
        }
        box.hidden = false;
        for (var i = 0; i < options.length; i++) {
          (function (option) {
            var button = document.createElement("button");
            button.type = "button";
            button.textContent = option.label;
            button.addEventListener("click", function () {
              var buttons = box.querySelectorAll("button");
              for (var j = 0; j < buttons.length; j++) buttons[j].disabled = true;
              button.textContent = "已选择：" + option.label;
              try {
                window.__TAURI_INTERNALS__.invoke("plugin:event|emit", {
                  event: "dsh-desktop:takeover-choice",
                  payload: { question: question, id: option.id }
                });
              } catch (error) {
                // Rust never heard the answer: say so instead of leaving a dead page.
                button.textContent = "选择没有送达，请关闭窗口重开";
              }
            });
            box.appendChild(button);
          })(options[i]);
        }
        if (pending[4]) {
          var hint = document.createElement("div");
          hint.className = "hint";
          hint.textContent = pending[4];
          box.appendChild(hint);
        }
      };

      // Ask Rust for another attempt. The splash window is the only one holding core
      // permissions (capabilities/splash.json), so the event bridge is the whole API it needs.
      document.getElementById("retry").addEventListener("click", function () {
        var button = this;
        var restore = function () {
          button.disabled = false;
          button.textContent = "重新启动 Harness";
        };
        button.disabled = true;
        button.textContent = "正在重启…";
        try {
          window.__TAURI_INTERNALS__
            .invoke("plugin:event|emit", { event: "dsh-desktop:restart-harness", payload: {} })
            .catch(restore);
        } catch (error) {
          restore();
        }
      });

      window.__applyStatus();
      window.__applyChoice();
    </script>
  </body>
</html>
